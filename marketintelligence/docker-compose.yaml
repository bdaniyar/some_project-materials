services:
  postgres:
    image: postgres:15.3
    container_name: one-time-secret-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketintelligence
    ports:
      - "8291:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: